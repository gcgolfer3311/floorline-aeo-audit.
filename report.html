<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>AI Visibility Report // Floorline AI</title>
<style>body{margin:0;background:#060a12;color:#8493a8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}a{color:#2dd4bf}</style>
<script>
  // Old share links (/report.html?id=...) now open in the main audit page.
  (function () {
    var base = /^\/audit(\/|$)/.test(location.pathname) ? "/audit" : "";
    var id = new URLSearchParams(location.search).get("id") || "";
    location.replace(base + "/" + (id ? "?r=" + encodeURIComponent(id) : ""));
  })();
</script>
</head>
<body><p>Opening report… <a href="/">continue</a></p></body>
